name: 🤖 Ciclo de trading

on:
  schedule:
    # Kickstart: Cada 15 min (en :04 :19 :34 :49 para esquivar los retrasos de GitHub en minutos redondos)
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}  # botón "Run workflow" para probar

permissions:
  contents: write

jobs:
  cycle:
    concurrency:
      group: bot-cycle
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ciclo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || 'none' }}
        run: |
          PYTHONUNBUFFERED=1 python3 bot.py cycle 2>&1 | tee -a bot.log
          tail -n 120 bot.log > log_tail.txt
          python3 -c "import json; from config import SYMBOLS; open('symbols.json','w').write(json.dumps(SYMBOLS))"

      - name: Guardar estado en el repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for f in state.json trades.jsonl equity.jsonl APRENDIDO.md log_tail.txt symbols.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "📊 ciclo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || { git pull --rebase origin HEAD && git push; }

  # Cadena automática: como el cron de GitHub está fallando (incidencia de la
  # plataforma desde ago-2026), cada ciclo programa el siguiente a los ~15 min
  # usando el secreto NEXT_RUN_TOKEN. El cron anterior queda como respaldo.
  chain:
    needs: cycle
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Programar el siguiente ciclo (~15 min)
        env:
          GH_TOKEN: ${{ secrets.NEXT_RUN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sin NEXT_RUN_TOKEN: se depende solo del cron de GitHub"
            exit 0
          fi
          # Espaciar ciclos a ~15 min (el ciclo tarda ~1 min)
          sleep 840
          # Dedupe: solo el run más reciente de ESTE workflow encadena,
          # así nunca hay dos cadenas (runs manuales o cron pasan a liderar).
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/runs?per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo 0)
          if [ "$LATEST" != "$GITHUB_RUN_ID" ]; then
            echo "Hay un run más reciente ($LATEST vs $GITHUB_RUN_ID): esa cadena se encarga"
            exit 0
          fi
          if gh workflow run bot.yml -R "$GITHUB_REPOSITORY"; then
            echo "✓ Siguiente ciclo programado"
          else
            echo "⚠ No se pudo programar el siguiente ciclo"
          fi
